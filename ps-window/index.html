<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pokémon Showdown · Shelf battle</title><link rel="stylesheet" href="battle.css"><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font:12px Arial,sans-serif;overflow:hidden}#battle-wrap{position:relative;width:100%;height:360px;overflow:hidden}.battle{top:0;left:0;border:0;transform-origin:top left}.battle-log{position:relative;left:0;top:0;width:100%;height:140px;max-height:none;border:0;border-top:1px solid #aeb8bf;overflow:auto;padding:9px 12px;font:12px/1.5 Verdana,sans-serif;background:#fff;color:#222}.battle-log h2{font-size:13px;margin:6px 0}.battle-log .chat{padding:2px 0}.wide{display:grid;grid-template-columns:640px 1fr;height:360px}.wide #battle-log{height:360px;border-top:0;border-left:1px solid #aeb8bf}.backdrop{background-size:700px 500px!important;opacity:1!important}.weather{background-image:none!important}.tooltips{display:none!important}.trainersprite{background-size:42px 42px!important;background-position:center!important;background-repeat:no-repeat!important}.leftbar,.rightbar{background:rgba(255,255,255,.45)!important;border-color:#a8b5a677!important}.teamicons{display:none}.battle-log .battle-options{display:none}.messagebar{background:rgba(255,255,255,.86)}.statbar strong{font-weight:bold}.battle a{pointer-events:none}
#commander-note{position:absolute;bottom:7px;left:8px;z-index:10;font:10px Arial,sans-serif;color:#284e61;background:#f2fbffb0;border-radius:3px;padding:3px 6px}#commander-note:empty{display:none}</style></head><body><div id="battle-wrap"><div id="battle" class="battle"></div><div id="commander-note"></div></div><div id="battle-log" class="battle-log" role="log" aria-live="polite"></div><script src="data.js"></script><script type="module" src="window.js"></script></body></html>
