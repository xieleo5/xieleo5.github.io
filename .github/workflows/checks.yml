name: Validate homepage
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:battle
      - run: node arcade-checks.mjs
      - run: node bug-report-checks.mjs
      - run: node physics-checks.mjs
      - run: node control-stability-checks.mjs
